<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2196f3">
  <title>Best Life Tracker</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Roboto, Arial, sans-serif; background: #f9f9f9; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 10px; }
    h2 { margin: 20px 0 10px 0; }
    h3 { margin: 15px 0 10px 0; font-size: 16px; }
    .settings { background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
    input[type="time"], input[type="date"], input[type="number"], textarea { 
      width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; 
    }
    label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: bold; }
    button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #333; color: #fff; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn-info { background: #2196f3; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }
    .view-tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; margin-bottom: 10px; }
    .view-tabs button { width: 100%; padding: 10px 2px; font-size: 13px; }
    .view-tabs button.active { background: #333; color: #fff; }
    .view-tabs button:not(.active) { background: #999; color: #fff; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .card-blue { background: #e3f2fd; }
    .card-orange { background: #fff3e0; }
    .step { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .step.done { background: #e8f5e9; opacity: 0.7; }
    .step-header { display: flex; justify-content: space-between; align-items: start; }
    .step-time { font-weight: bold; font-size: 13px; }
    .verse-card { background: #faf8f3; border: 2px solid #8b7355; border-radius: 8px; padding: 20px; margin-bottom: 20px; text-align: center; }
    .verse-text { font-style: italic; font-size: 14px; margin-bottom: 10px; }
    .verse-controls { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .add-verse { background: #fff9f0; border: 1px solid #ddd; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    .anytime-item { background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 10px; }
    .anytime-item.done { background: #e8f5e9; opacity: 0.7; }
    .progress-bar { background: #fff; height: 10px; border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .progress-fill { background: #2196f3; height: 100%; }
    .hydration-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .hydration-buttons button { padding: 8px; font-size: 12px; }
    .hidden { display: none; }
    .mini-row { display: flex; gap: 4px; }
    .mini { padding: 4px 10px; font-size: 13px; background: #f0f0f0; color: #333; }
    details.card summary { cursor: pointer; font-size: 15px; }
    .cash-guide { font-size: 14px; line-height: 1.5; }
    .cash-guide p { margin: 8px 0; }
    .cash-guide h4 { margin: 12px 0 4px; font-size: 14px; }
    .cash-guide ul, .cash-guide ol { margin: 6px 0 6px 20px; }
    .cash-guide li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>BEST LIFE TRACKER</h1>
    
    <div class="settings">
      <div class="grid-2">
        <div><label>Wake Time</label><input type="time" id="wakeTime" value="08:00" onchange="localStorage.setItem('wakeTime', this.value);"></div>
        <div><label>Bedtime (for sleep tracking)</label><input type="time" id="bedTime" value="22:00" onchange="state.bedTime=this.value;localStorage.setItem('bedTime', this.value);saveData(document.getElementById('currentDate').value);"></div>
      </div>
      
      <div style="margin-top:10px;">
        <label>Date</label><input type="date" id="currentDate" onchange="handleDateChange()">
      </div>
      
      <button onclick="submitDashboardSleep()" style="margin-top:10px;background:#4caf50;color:#fff;width:100%;padding:10px;">
        ✓ Submit Bedtime/Wake Time for This Date
      </button>
      <div id="sleepSubmitStatus" style="font-size:14px;margin-top:6px;color:#4caf50;"></div>
      
      <div class="view-tabs">
        <button class="active" onclick="setView('routine')">📋 Routine</button>
        <button onclick="setView('tracking')">📊 Tracking</button>
        <button onclick="setView('projects')">⏱️ Projects</button>
        <button onclick="setView('workouts')">💪 Workouts</button>
        <button onclick="setView('cash')">🐕 Cash</button>
      </div>
      
      <div class="grid-2" style="margin-top: 10px;">
        <button class="btn-success" onclick="exportData()">⬇️ Export Data</button>
        <label style="background: #2196f3; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; margin: 0;">
          ⬆️ Import Data
          <input type="file" accept=".json" onchange="importData(event)" style="display: none;">
        </label>
      </div>
    </div>

    <div id="routineView"></div>
    <div id="trackingView" class="hidden"></div>
    <div id="projectsView" class="hidden"></div>
    <div id="workoutsView" class="hidden"></div>
    <div id="cashView" class="hidden"></div>
  </div>

  <script>
const VERSES = [
  { text: "For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.", reference: "2 Timothy 1:7", id: 1 },
  { text: "I can do all things through Christ which strengtheneth me.", reference: "Philippians 4:13", id: 2 },

  { text: "The joy of the LORD is your strength.", reference: "Nehemiah 8:10", id: 12 },
  { text: "Let us therefore come boldly unto the throne of grace, that we may obtain mercy.", reference: "Hebrews 4:16", id: 13 },
  { text: "For as a man thinketh in his heart, so is he.", reference: "Proverbs 23:7", id: 14 },
  { text: "Blessed is the man whose strength is in thee; in whose heart are the ways of them.", reference: "Psalm 84:5", id: 15 },
  { text: "He giveth power to the faint; and to them that have no might he increaseth strength.", reference: "Isaiah 40:29", id: 16 },
  { text: "I will praise thee; for I am fearfully and wonderfully made.", reference: "Psalm 139:14", id: 17 },
  { text: "Finally, brethren, whatsoever things are true, whatsoever things are honest, think on these things.", reference: "Philippians 4:8", id: 18 },

];

const DEFAULT_CHECKLIST = [
  { time: '8:00 AM', tag: 'FIXED', items: ['Out of bed (no snoozing)'] },
  { time: '8:15 AM', tag: 'done by', items: ['CPAP numbers checked (AHI, leak, hours)', 'Last night logged', 'Dream work / reconnoitering', 'Aleve taken', 'Bright lights on', { t: 'Heat Pad Round 1 started', heat: 'on' }] },
  { time: '8:30 AM', tag: 'done by', items: ['Outside with coffee or water', 'Water the seeds', 'Stretching', 'Pets treated', 'Breath of fire and breathing exercises', 'Time with God (5 min)', 'Mind control (10 min max): grounding, "Why am I suffering" meditation', { t: 'Heat Pad off (20-minute break)', heat: 'off' }] },
  { time: '8:50 AM', tag: 'done by', items: ['Drinks and yogurt prepped', { t: 'Heat Pad Round 2 started', heat: 'on' }] },
  { time: '9:15 AM', tag: 'done by', items: ['Eaten', 'Pills taken', 'Cash has his supplement', { t: 'Heat Pad off', heat: 'off' }] },
  { time: '10:30 AM', tag: 'done by', items: ['Workday started', 'Stock report/engagement/research'] },
  { time: '12:00 PM', tag: 'done by', items: ['Last full-strength coffee poured (decaf or half-strength after)'] },
  { time: '2:00 PM', tag: 'done by', items: ['Lunch eaten', 'Heat pad routine (10 min no heat, 20 min heat)', 'Check-in with God', 'Short Cash walk', 'Back at your desk'] },
  { time: '3:00 PM', tag: 'done by', items: ['Large glass of water has been drunk'] },
  { time: '5:30 PM', tag: 'done by', items: ['Workday done'] },
  { time: '6:00 PM', tag: 'done by', items: ['Have made dinner', { t: 'Have microwaved heat packs for HEAT ON round 1 then sat down to eat', heat: 'on' }] },
  { time: '6:00 PM', tag: 'done by', items: [{ t: 'HEAT OFF for 20 minutes', heat: 'off' }] },
  { time: '6:20 PM', tag: 'done by', items: [{ t: 'HEAT ON round 2', heat: 'on' }] },
  { time: '7:00 PM', tag: 'done by', items: ['Dinner done', 'Kitchen closed', 'Must be with Susan', 'Lamps Low'] },
  { time: '8:00 PM', tag: 'FIXED', items: ['TV off', 'Any small snacks finished'] },
  { time: '8:25 PM', tag: 'done by', items: ['Susan has taken her pill', 'Nightly prayer together', 'In bed with Susan, cuddle until she is asleep (no phone)', 'Set thermostat', 'Diffuser'] },
  { time: '9:00 PM', tag: 'done by', items: ['15-minutes why am I suffering, prayer, mind training BLOCK... in bath or not', 'Teeth brushed', 'CPAP mask and hose checked', 'Tomorrow clothes set out, etc.'] },
  { time: '9:45 PM', tag: 'done by', items: ['Any bathing + grooming + skincare', 'Last bathroom trip', 'Be in bed, mask on, lights off, audio off', { t: 'Evening practice started (reflection, slow breathing, body scan)', fixed: true }] }
];

// The checklist is user-editable and saved under 'checklist'. Each item keeps the
// key it was given (slug of the original text for defaults), so completion
// history survives renames and moves. item.date = shown on that date only.
let CHECKLIST = loadChecklist();

function loadChecklist() {
  try {
    const raw = localStorage.getItem('checklist');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const used = new Set();
  return DEFAULT_CHECKLIST.map(block => ({ ...block, items: block.items.map(it => {
    const item = typeof it === 'string' ? { t: it } : { ...it };
    let key = 'c_' + item.t.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 40);
    while (used.has(key)) key += '_';
    used.add(key);
    item.key = key;
    return item;
  }) }));
}

// Cash's daily care, added once to whatever checklist exists. Same-time blocks are
// reused; otherwise a new block goes in time order. The flag stops a deleted task
// from coming back. Item keys are fixed so completion history lines up.
const CASH_DAILY_TASKS = [
  { time: '8:00 AM', tag: 'done by', key: 'c_cash_out_morning', t: 'Let Cash out back' },
  { time: '8:15 AM', tag: 'done by', key: 'c_cash_breakfast', t: 'Cash breakfast: bowl down 15 minutes, then pick it up (save a handful for training)' },
  { time: '9:30 AM', tag: 'start by', key: 'c_cash_exercise', t: 'Dog park with Cash (fixed leash, no toys). Sore-back day: "Find it" in the yard instead' },
  { time: '10:15 AM', tag: 'done by', key: 'c_cash_training_am', t: 'Cash training, 10 min: door "Stay" and "Leave it"' },
  { time: '12:00 PM', tag: 'done by', key: 'c_cash_out_noon', t: 'Let Cash out back + a few minutes of "Find it"' },
  { time: '5:00 PM', tag: 'start by', key: 'c_cash_dinner', t: 'Cash dinner: bowl down 15 minutes, then pick it up' },
  { time: '5:30 PM', tag: 'done by', key: 'c_cash_training_pm', t: 'Cash training, 10 min: "With me" and "Look at that"' },
  { time: '9:30 PM', tag: 'done by', key: 'c_cash_out_night', t: 'Let Cash out back one last time. Leash up high, snacks and trash away' }
];

function addCashTasksOnce() {
  if (localStorage.getItem('cashPlanV1')) return;
  const existing = new Set(CHECKLIST.flatMap(b => b.items.map(it => it.key)));
  CASH_DAILY_TASKS.forEach(({ time, tag, key, t }) => {
    if (existing.has(key)) return;
    let block = CHECKLIST.find(b => b.time === time);
    if (!block) {
      block = { time, tag, items: [] };
      let at = CHECKLIST.findIndex(b => clockToMinutes(b.time) > clockToMinutes(time));
      if (at === -1) at = CHECKLIST.length;
      CHECKLIST.splice(at, 0, block);
    }
    block.items.push({ t, key });
  });
  localStorage.setItem('checklist', JSON.stringify(CHECKLIST));
  localStorage.setItem('cashPlanV1', '1');
}

function saveChecklist() {
  localStorage.setItem('checklist', JSON.stringify(CHECKLIST));
  rebuildRoutine();
  render();
}

// Rebuild ROUTINE entries + SCHEDULED_ORDER from CHECKLIST (date-only items aren't tracked)
const ROUTINE = {};
const SCHEDULED_ORDER = [];
function rebuildRoutine() {
  Object.keys(ROUTINE).forEach(k => delete ROUTINE[k]);
  SCHEDULED_ORDER.length = 0;
  CHECKLIST.forEach(block => block.items.forEach(it => {
    ROUTINE[it.key] = { name: it.t, trackable: !it.date, scheduled: true };
    if (!it.date) SCHEDULED_ORDER.push(it.key);
  }));
  Object.assign(ROUTINE, ANYTIME_ROUTINE);
}

const ANYTIME_ROUTINE = {
  // Anytime activities (no scheduled times)
  cashActivity: { name: '15 min activity with Cash', trackable: true, scheduled: false },
  stretchMobility: { name: 'Stretching + Standing mobility (knees→back→arms)', trackable: true, scheduled: false },
  workoutA: { name: 'Workout A', trackable: true, scheduled: false, exercises: ['Hip hinge', 'Squat', 'Side steps', 'Glute bridges', 'Calf raises'] },
  workoutB: { name: 'Workout B', trackable: true, scheduled: false, exercises: ['Overhead press', 'Chest press', 'Row', 'Rear shoulders', 'Bicep curl', 'Tricep ext'] },
  workoutC: { name: 'Workout C', trackable: true, scheduled: false, exercises: ['Suitcase carry', 'Lateral raises', 'Rotation', 'Dead bug/bird dog'] },
  cardio: { name: 'Cardio', trackable: true, scheduled: false },
  foodLog: { name: 'Log food', trackable: true, scheduled: false },
};
addCashTasksOnce();
rebuildRoutine();

const ANYTIME_ORDER = ['cashActivity', 'stretchMobility', 'workoutA', 'workoutB', 'workoutC', 'cardio', 'foodLog'];

function isItemVisible(it, date) { return !it.date || it.date === date; }

function clockToMinutes(s) {
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(s || '');
  if (!m) return 0;
  return (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +m[2];
}

function newItemKey() { return 'c_u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

// New time blocks go in time order; after that they can be moved freely.
function addBlock() {
  const time = document.getElementById('newBlockTime').value;
  if (!time) return alert('Pick a time for the new block');
  const label = formatClock(time);
  const tag = document.getElementById('newBlockTag').value;
  const first = document.getElementById('newBlockTask').value.trim();
  const items = first ? [{ t: first, key: newItemKey() }] : [];
  let at = CHECKLIST.findIndex(b => clockToMinutes(b.time) > clockToMinutes(label));
  if (at === -1) at = CHECKLIST.length;
  CHECKLIST.splice(at, 0, { time: label, tag, items });
  saveChecklist();
}

function moveBlock(bi, dir) {
  const to = bi + dir;
  if (to < 0 || to >= CHECKLIST.length) return;
  [CHECKLIST[bi], CHECKLIST[to]] = [CHECKLIST[to], CHECKLIST[bi]];
  saveChecklist();
}

function editBlock(bi) {
  const block = CHECKLIST[bi];
  const time = prompt('Time (e.g. 8:30 AM):', block.time);
  if (time === null || !time.trim()) return;
  const tag = prompt('Tag ("done by" or "FIXED"):', block.tag);
  block.time = time.trim();
  if (tag !== null && tag.trim()) block.tag = /^fixed$/i.test(tag.trim()) ? 'FIXED' : tag.trim();
  saveChecklist();
}

function deleteBlock(bi) {
  const block = CHECKLIST[bi];
  if (!confirm(`Delete the ${block.time} block and its ${block.items.length} task(s)? Past check-offs stay recorded.`)) return;
  CHECKLIST.splice(bi, 1);
  saveChecklist();
}

function addItem(bi) {
  const t = document.getElementById(`newItem_${bi}`).value.trim();
  if (!t) return alert('Enter a task');
  const item = { t, key: newItemKey() };
  if (document.getElementById(`newItemRepeat_${bi}`).value === 'once') item.date = document.getElementById('currentDate').value;
  CHECKLIST[bi].items.push(item);
  saveChecklist();
}

// Moves past items hidden on this date; at a block's edge it hops into the neighboring block.
function moveItem(bi, ii, dir) {
  const date = document.getElementById('currentDate').value;
  const items = CHECKLIST[bi].items;
  let j = ii + dir;
  while (j >= 0 && j < items.length && !isItemVisible(items[j], date)) j += dir;
  const inBlock = j >= 0 && j < items.length;
  if (!inBlock && !CHECKLIST[bi + dir]) return;
  const [item] = items.splice(ii, 1);
  // Moving down, the removal shifts the neighbor to j-1, so inserting at j lands just after it
  if (inBlock) items.splice(j, 0, item);
  else if (dir < 0) CHECKLIST[bi - 1].items.push(item);
  else CHECKLIST[bi + 1].items.unshift(item);
  saveChecklist();
}

function editItem(bi, ii) {
  const item = CHECKLIST[bi].items[ii];
  const t = prompt('Task:', item.t);
  if (t === null || !t.trim()) return;
  item.t = t.trim();
  saveChecklist();
}

function deleteItem(bi, ii) {
  const item = CHECKLIST[bi].items[ii];
  if (!confirm(`Delete "${item.t}"? Past check-offs stay recorded.`)) return;
  CHECKLIST[bi].items.splice(ii, 1);
  saveChecklist();
}

function formatClock(hhmm) {
  if (!hhmm) return '';
  let [h, m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let lastLoadedDate = null;

let state = {
  view: 'routine',
  verses: [...VERSES],
  verseIndex: 0,
  completed: {},
  anytimeCompleted: {},
  hydration: 0,
  projectTimers: { BNBS: 0, DEV: 0, CAREER: 0, IREC: 0 },
  activeProject: null,
  timerRunning: false,
  bedTime: '22:00',
  weeklyData: {},
  anytimeWeeklyData: {},
  projectWeeklyData: {},
  workoutComponents: {
    A: { 'Hip hinge': 0, 'Squat': 0, 'Side steps': 0, 'Glute bridges': 0, 'Calf raises': 0 },
    B: { 'Overhead press': 0, 'Chest press': 0, 'Row': 0, 'Rear shoulders': 0, 'Bicep curl': 0, 'Tricep ext': 0 },
    C: { 'Suitcase carry': 0, 'Lateral raises': 0, 'Rotation': 0, 'Dead bug/bird dog': 0 }
  },
  stepsMinutes: 0,
  sleepData: {},
  sleepTimes: {}
};

function init() {
  const today = toDateStr(new Date());
  document.getElementById('currentDate').value = today;
  state.bedTime = localStorage.getItem('bedTime') || state.bedTime;
  document.getElementById('bedTime').value = state.bedTime;
  document.getElementById('wakeTime').value = localStorage.getItem('wakeTime') || '08:00';
  lastLoadedDate = today;
  loadData(today);
  render();
  let saveTickCounter = 0;
  setInterval(() => {
    if (state.timerRunning && state.activeProject) {
      state.projectTimers[state.activeProject]++;
      // Only the Projects view shows the ticking timer; re-rendering others would wipe half-typed inputs
      if (state.view === 'projects') render();
      saveTickCounter++;
      if (saveTickCounter >= 10) {
        saveTickCounter = 0;
        saveState();
      }
    }
  }, 1000);
}

function loadData(date) {
  // Reset to clean defaults first. Without this, switching to a date with
  // no saved data yet would silently keep whatever was in memory from the
  // previously viewed date (e.g. today's timers bleeding into a blank day).
  state.completed = {};
  state.anytimeCompleted = {};
  state.hydration = 0;
  state.projectTimers = { BNBS: 0, DEV: 0, CAREER: 0, IREC: 0 };
  state.activeProject = null;
  state.stepsMinutes = 0;
  state.workoutComponents = {
    A: { 'Hip hinge': 0, 'Squat': 0, 'Side steps': 0, 'Glute bridges': 0, 'Calf raises': 0 },
    B: { 'Overhead press': 0, 'Chest press': 0, 'Row': 0, 'Rear shoulders': 0, 'Bicep curl': 0, 'Tricep ext': 0 },
    C: { 'Suitcase carry': 0, 'Lateral raises': 0, 'Rotation': 0, 'Dead bug/bird dog': 0 }
  };

  const completed = localStorage.getItem(`completed_${date}`);
  const anytime = localStorage.getItem(`anytime_${date}`);
  const hydration = localStorage.getItem(`hydration_${date}`);
  const projects = localStorage.getItem(`projects_${date}`);
  const workouts = localStorage.getItem(`workouts_${date}`);
  const steps = localStorage.getItem(`steps_${date}`);
  const verses = localStorage.getItem('verses');
  const verseIndex = localStorage.getItem('verseIndex');
  
  if (steps) state.stepsMinutes = parseInt(steps) || 0;
  if (completed) state.completed = JSON.parse(completed);
  if (anytime) state.anytimeCompleted = JSON.parse(anytime);
  if (hydration) state.hydration = parseInt(hydration);
  if (projects) state.projectTimers = JSON.parse(projects);
  if (workouts) state.workoutComponents = JSON.parse(workouts);
  if (verses) state.verses = JSON.parse(verses);
  if (verseIndex) state.verseIndex = parseInt(verseIndex);
  
  // Load all sleep data from this week
  const monday = getMondayOfWeek(date);
  const d = parseDate(monday);
  for (let i = 0; i < 7; i++) {
    const dayDate = new Date(d);
    dayDate.setDate(dayDate.getDate() + i);
    const dayStr = toDateStr(dayDate);
    const sleepHours = localStorage.getItem(`sleep_${dayStr}`);
    if (sleepHours) state.sleepData[dayStr] = parseFloat(sleepHours);
    const bed = localStorage.getItem(`sleepBed_${dayStr}`);
    const wake = localStorage.getItem(`sleepWake_${dayStr}`);
    if (bed || wake) state.sleepTimes[dayStr] = { bed: bed || '', wake: wake || '' };
  }
}

function submitDashboardSleep() {
  const date = document.getElementById('currentDate').value;
  const bed = document.getElementById('bedTime').value;
  const wake = document.getElementById('wakeTime').value;
  const status = document.getElementById('sleepSubmitStatus');
  if (!date || !bed || !wake) {
    status.style.color = '#f44336';
    status.textContent = 'Please set date, bedtime, and wake time first.';
    return;
  }
  updateSleepTimes(date, bed, wake);
  const hours = computeSleepDuration(bed, wake);
  status.style.color = '#4caf50';
  status.textContent = `Saved: ${hours.toFixed(1)}h sleep for ${date} (bed ${bed} → wake ${wake})`;
}

function updateSleepTimes(dayStr, bed, wake) {
  state.sleepTimes[dayStr] = { bed, wake };
  localStorage.setItem(`sleepBed_${dayStr}`, bed);
  localStorage.setItem(`sleepWake_${dayStr}`, wake);
  if (bed && wake) {
    const hours = computeSleepDuration(bed, wake);
    state.sleepData[dayStr] = hours;
    localStorage.setItem(`sleep_${dayStr}`, hours.toFixed(1));
  }
  render();
}

function computeSleepDuration(bedStr, wakeStr) {
  const [bh, bm] = bedStr.split(':').map(Number);
  const [wh, wm] = wakeStr.split(':').map(Number);
  let bedMinutes = bh * 60 + bm;
  let wakeMinutes = wh * 60 + wm;
  if (wakeMinutes <= bedMinutes) wakeMinutes += 24 * 60;
  return (wakeMinutes - bedMinutes) / 60;
}

function updateSleepHours(dayStr, hours) {
  state.sleepData[dayStr] = hours;
  localStorage.setItem(`sleep_${dayStr}`, hours.toFixed(1));
  render();
}

function handleDateChange() {
  // Save whatever is currently in memory under the date it actually belongs to,
  // BEFORE switching state over to the newly selected date. This prevents
  // today's numbers from overwriting a different date's saved data.
  if (lastLoadedDate) saveData(lastLoadedDate);

  // Stop any running timer when switching dates — it doesn't make sense
  // for a timer to keep counting into a day you're no longer viewing.
  cancelPendingResume();
  if (state.timerRunning) {
    state.timerRunning = false;
  }

  const newDate = document.getElementById('currentDate').value;
  loadData(newDate);
  lastLoadedDate = newDate;
  render();
}

function saveState() {
  const date = document.getElementById('currentDate').value || toDateStr(new Date());

}

let inputIdleTimeout;
let resumeAfterEdit = false;

// Pause while a time is being typed in, then resume 5s later — but only if
// the timer was running before the edit. A stopped timer stays stopped.
function updateProjectTime(proj, h, m, s) {
  state.projectTimers[proj] = (h || 0) * 3600 + (m || 0) * 60 + (s || 0);
  if (state.timerRunning) resumeAfterEdit = true;
  state.timerRunning = false;
  clearTimeout(inputIdleTimeout);
  inputIdleTimeout = setTimeout(() => {
    if (resumeAfterEdit) {
      state.timerRunning = true;
      render();
    }
    resumeAfterEdit = false;
  }, 5000);
  saveState();
  render();
}

// Any explicit start/stop overrides a pending resume from updateProjectTime.
function cancelPendingResume() {
  clearTimeout(inputIdleTimeout);
  resumeAfterEdit = false;
}

function stopAllTimers() {
  cancelPendingResume();
  state.timerRunning = false;
  saveState();
  render();
}

function toggleTimer(project) {
  cancelPendingResume();
  if (state.activeProject === project) {
    state.timerRunning = !state.timerRunning;
  } else {
    state.activeProject = project;
    state.timerRunning = true;
  }
  saveState();
  render();
}

function nextVerse() {
  state.verseIndex = (state.verseIndex + 1) % state.verses.length;
  localStorage.setItem('verseIndex', state.verseIndex);

}

function prevVerse() {
  state.verseIndex = state.verseIndex === 0 ? state.verses.length - 1 : state.verseIndex - 1;
  localStorage.setItem('verseIndex', state.verseIndex);
  render();
}

function removeVerse() {
  state.verses.splice(state.verseIndex, 1);
  if (state.verses.length === 0) state.verses = [...VERSES];
  state.verseIndex = state.verseIndex >= state.verses.length ? 0 : state.verseIndex;
  localStorage.setItem('verses', JSON.stringify(state.verses));
  localStorage.setItem('verseIndex', state.verseIndex);
  render();
}

function addVerse() {
  const text = document.getElementById('verseText').value;
  const ref = document.getElementById('verseRef').value;
  if (!text || !ref) return alert('Enter verse text and reference');
  state.verses.push({ text, reference: ref, id: Date.now() });

  document.getElementById('verseRef').value = '';
  render();
}

function getStepTime(offset) {
  const wake = document.getElementById('wakeTime').value;
  let [h, m] = wake.split(':').map(Number);
  m += offset;
  if (m >= 60) {
    h += Math.floor(m / 60);
    m = m % 60;
  }
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function calculateSleep() {
  const wake = document.getElementById('wakeTime').value;
  const bed = document.getElementById('bedTime').value;
  const bedH = parseInt(bed.split(':')[0]);
  const bedM = parseInt(bed.split(':')[1]);
  const wakeH = parseInt(wake.split(':')[0]);
  const wakeM = parseInt(wake.split(':')[1]);
  
  let bedMin = bedH * 60 + bedM;
  let wakeMin = wakeH * 60 + wakeM;
  if (wakeMin < bedMin) wakeMin += 24 * 60;
  
  return (wakeMin - bedMin) / 60;
}

function calculateBurndownTime(wakeTime, offsetFromEnd) {
  // Work starts at 8:30
  const deadline = 8 * 60 + 30; // 8:30 in minutes
  const [wh, wm] = wakeTime.split(':').map(Number);
  const wakeMin = wh * 60 + wm;
  
  const deadlineMin = deadline - offsetFromEnd;
  const h = Math.floor(deadlineMin / 60);
  const m = deadlineMin % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// Dates are stored as local YYYY-MM-DD. toISOString() is UTC, which rolls over to
// tomorrow in the evening, and new Date("YYYY-MM-DD") parses as UTC midnight,
// which is the previous day locally. Parse at local noon so setDate() and DST stay safe.
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseDate(dateStr) {
  return new Date(dateStr + 'T12:00:00');
}

function getMondayOfWeek(date) {
  const d = parseDate(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return toDateStr(new Date(d.setDate(diff)));
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function exportData() {
  const backup = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    backup[key] = localStorage.getItem(key);
  }
  const date = document.getElementById('currentDate').value;
  const file = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = `routine-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const backup = JSON.parse(event.target.result);
      Object.entries(backup).forEach(([key, value]) => {
        localStorage.setItem(key, value);
      });
      if (!('cashPlanV1' in backup)) localStorage.removeItem('cashPlanV1');
      alert('Data restored. Refreshing...');
      location.reload();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function getScheduledDoneForDate(k, dateStr) {
  const currentDate = document.getElementById('currentDate').value;
  if (dateStr === currentDate) return state.completed[k] ? 1 : 0;

  if (!raw) return 0;
  try { return JSON.parse(raw)[k] ? 1 : 0; } catch (e) { return 0; }
}

function getAnytimeDoneForDate(k, dateStr) {
  const currentDate = document.getElementById('currentDate').value;
  if (dateStr === currentDate) return state.anytimeCompleted[k]?.done ? 1 : 0;
  const raw = localStorage.getItem(`anytime_${dateStr}`);
  if (!raw) return 0;
  try { return JSON.parse(raw)[k]?.done ? 1 : 0; } catch (e) { return 0; }
}

function getWorkoutCountForDate(type, comp, dateStr) {
  const currentDate = document.getElementById('currentDate').value;
  if (dateStr === currentDate) return state.workoutComponents[type][comp] || 0;
  const raw = localStorage.getItem(`workouts_${dateStr}`);
  if (!raw) return 0;
  try { return JSON.parse(raw)[type]?.[comp] || 0; } catch (e) { return 0; }
}

function sumOverRange(getterFn, startDateStr, endDateStr) {
  let total = 0;
  const d = parseDate(startDateStr);
  const end = parseDate(endDateStr);
  while (d <= end) {
    const dateStr = toDateStr(d);
    total += getterFn(dateStr);
    d.setDate(d.getDate() + 1);
  }
  return total;
}

        const annualPct = Math.round(annualCount / annualGoal * 100);

          const annualCount = sumOverRange(dt => getWorkoutCountForDate(type, comp, dt), yearStart, date);

          const monthlyPct = Math.round(monthlyCount / 26 * 100);

            </thead>
            <tbody>${rows}</tbody>
          </table>`;

function cashRead(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}

function cashDate() { return document.getElementById('currentDate').value; }

function cashStepper(key, delta, max) {
  const now = parseInt(localStorage.getItem(key)) || 0;
  localStorage.setItem(key, Math.min(max, Math.max(0, now + delta)));
  render();
}

function toggleCashWeekly(dateStr, id) {
  const day = cashRead(`cashWeekly_${dateStr}`, {});
  day[id] = !day[id];
  localStorage.setItem(`cashWeekly_${dateStr}`, JSON.stringify(day));
  render();
}

function toggleCashSetup(id) {
  const setup = cashRead('cashSetup', {});
  setup[id] = !setup[id];
  localStorage.setItem('cashSetup', JSON.stringify(setup));
  render();
}

function markCashCare(id) {
  const care = cashRead('cashCare', {});
  care[id] = cashDate();
  localStorage.setItem('cashCare', JSON.stringify(care));
  render();
}

function cashWalkMinutes(dateStr) { return parseInt(localStorage.getItem(`cashWalk_${dateStr}`)) || 0; }

function setCashWalk(value) {
  localStorage.setItem(`cashWalk_${cashDate()}`, Math.max(0, parseInt(value) || 0));
  render();
}

function cashWalkCard() {
  const step = Math.min(parseInt(localStorage.getItem('cashWalkStep')) || 0, CASH_WALK_STEPS.length - 1);
  const date = cashDate();
  const weekTotal = sumOverRange(cashWalkMinutes, getMondayOfWeek(date), date);
  const atTop = step === CASH_WALK_STEPS.length - 1;
  return `
    <div class="card card-orange">
      <h3 style="margin-top:0;">🚶 Your walk with Cash</h3>
      <p style="font-size:15px;margin-bottom:8px;">Today's goal: <strong>${CASH_WALK_STEPS[step]} minutes</strong> (step ${step + 1} of ${CASH_WALK_STEPS.length}), on your 2:00 PM Short Cash walk. Any amount counts.</p>
      <label style="font-weight:normal;font-size:14px;">Minutes today: <input type="number" min="0" value="${cashWalkMinutes(date) || ''}" onchange="setCashWalk(this.value)" style="width:80px;padding:6px;"/></label>
      <p style="font-size:14px;color:#555;margin:8px 0;">This week: ${weekTotal} minutes</p>
      <div class="mini-row" style="flex-wrap:wrap;">
        <button class="mini" onclick="cashStepper('cashWalkStep', -1, ${CASH_WALK_STEPS.length - 1})">← Easier</button>
        <button class="mini" onclick="cashStepper('cashWalkStep', 1, ${CASH_WALK_STEPS.length - 1})">Felt OK, step up →</button>
      </div>
      <p style="font-size:13px;color:#555;margin-top:8px;">Stay on a step as long as you need; six weeks is a target, not a deadline. If walking makes your pain worse, ease back and check with your doctor. ${atTop ? 'You\'re at the top step: try swapping a dog park day for a longer walk when you feel ready.' : 'The dog park stays as his main exercise until you\'re ready for longer walks.'}</p>
    </div>`;
}

function cashCareRow([id, name, how, days]) {
  const last = cashRead('cashCare', {})[id];
  let status = '<span style="color:#666;">Not logged yet</span>';
  if (last) {
    const left = days - Math.round((parseDate(cashDate()) - parseDate(last)) / 86400000);
    status = left <= 0
      ? `<span style="color:#c62828;font-weight:bold;">Due</span> <span style="color:#666;">(last ${last})</span>`
      : `<span style="color:#2e7d32;">Next in ${left} day${left === 1 ? '' : 's'}</span> <span style="color:#666;">(last ${last})</span>`;
  }
  return `<div class="step" style="padding:10px;margin-bottom:6px;">
    <div class="step-header" style="align-items:center;gap:10px;">
      <div style="font-size:14px;"><strong>${name}</strong><br><span style="font-size:12px;color:#555;">${how}</span><br><span style="font-size:12px;">${status}</span></div>
      <button onclick="markCashCare('${id}')" style="flex-shrink:0;background:#f0f0f0;color:#333;">Done</button>
    </div>
  </div>`;
}

      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead><tr><th></th>${weekDates.map((dt, i) => `<th style="padding:2px;font-size:11px;${dt === date ? 'color:#2196f3;' : ''}">${'MTWTFSS'[i]}</th>`).join('')}</tr></thead>
        <tbody>${CASH_WEEKLY_ITEMS.map(([id, label]) => `<tr>
          <td style="padding:6px 4px 6px 0;border-top:1px solid #eee;">${label}</td>
          ${weekDates.map(dt => {
            const on = !!cashRead(`cashWeekly_${dt}`, {})[id];
            return `<td style="padding:2px;border-top:1px solid #eee;text-align:center;"><button onclick="toggleCashWeekly('${dt}', '${id}')" aria-label="${label} on ${dt}" style="width:28px;height:28px;padding:0;font-size:13px;background:${on ? '#4caf50' : '#f0f0f0'};color:#fff;">${on ? '✓' : ''}</button></td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
      </table>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Regular care</h3>
      ${CASH_CARE.map(cashCareRow).join('')}
    </div>

    <details class="card" data-guide="setup" ontoggle="cashGuideToggle(this)" ${cashOpenGuide.has('setup') ? 'open' : ''}>
      <summary><strong>Setup and supplies</strong> (${setupDone} of ${allSetup.length})</summary>
      ${CASH_SETUP_GROUPS.map(([title, items]) => `<h4 style="margin:12px 0 6px;">${title}</h4>
        ${items.map(([id, label]) => `<label style="display:flex;gap:8px;align-items:flex-start;font-weight:normal;font-size:14px;margin-bottom:8px;"><input type="checkbox" ${setup[id] ? 'checked' : ''} onchange="toggleCashSetup('${id}')" style="margin-top:3px;"> <span>${label}</span></label>`).join('')}`).join('')}
    </details>

    <h3>The plan</h3>
    ${CASH_GUIDE.map(([title, body], i) => `<details class="card cash-guide" data-guide="g${i}" ontoggle="cashGuideToggle(this)" ${cashOpenGuide.has('g' + i) ? 'open' : ''}><summary><strong>${title}</strong></summary>${body}</details>`).join('')}
  `;

  document.getElementById('cashView').innerHTML = html;
  ['routineView', 'trackingView', 'projectsView', 'workoutsView'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('cashView').classList.remove('hidden');
}

function cashGuideToggle(el) {
  if (el.open) cashOpenGuide.add(el.dataset.guide);
  else cashOpenGuide.delete(el.dataset.guide);
}

function cashTrackingCard(date, weekStart, monthStart, yearStart, daysInMonth, daysInYear) {
  const row = (name, week, month, year) => `<div style="font-size:16px;margin-bottom:10px;padding:8px;background:#f0f0f0;border-radius:4px;"><strong>${name}</strong><br>${week} | ${month} | ${year}</div>`;
  const items = CASH_WEEKLY_ITEMS.map(([id, label]) => {
    const did = dt => cashRead(`cashWeekly_${dt}`, {})[id] ? 1 : 0;
    const count = start => sumOverRange(did, start, date);
    return row(label, `Weekly: ${count(weekStart)}/7`, `Monthly: ${count(monthStart)}/${daysInMonth}`, `Annual: ${count(yearStart)}/${daysInYear}`);
  }).join('');
  const walked = start => sumOverRange(cashWalkMinutes, start, date);
  return `
    <div class="card">
      <h3>Cash</h3>
      <p style="font-size:14px;color:#555;margin-bottom:8px;">His daily tasks are under Scheduled Trackables above. Tick these on the Cash tab.</p>
      ${row('Minutes walked with Cash', `Weekly: ${walked(weekStart)}`, `Monthly: ${walked(monthStart)}`, `Annual: ${walked(yearStart)}`)}
      ${items}
    </div>`;
}

function getProjectHoursForDate(proj, dateStr) {
  const currentDate = document.getElementById('currentDate').value;
  if (dateStr === currentDate) {
    return (state.projectTimers[proj] || 0) / 3600;
  }
  const raw = localStorage.getItem(`projects_${dateStr}`);
  if (!raw) return 0;
  try {
    const data = JSON.parse(raw);
    return (data[proj] || 0) / 3600;
  } catch (e) {
    return 0;
  }
}

function sumProjectHours(proj, startDateStr, endDateStr) {
  let total = 0;
  const d = parseDate(startDateStr);
  const end = parseDate(endDateStr);
  while (d <= end) {
    const dateStr = toDateStr(d);
    total += getProjectHoursForDate(proj, dateStr);
    d.setDate(d.getDate() + 1);
  }
  return total;
}

function clearProjectTimer(proj) {
  if (!confirm(`Clear today's ${proj} timer back to 0? This won't affect past days already recorded.`)) return;
  state.projectTimers[proj] = 0;
  cancelPendingResume();
  if (state.activeProject === proj) state.timerRunning = false;
  saveState();
  render();
}

// Work schedule: 0.5h lunch at 2:00 subtracted on full days only (none on half days)
const WORK_SCHEDULE = {
  0: null,
  1: { start: '10:30', end: '5:30', hours: 6.5 },
  2: { start: '10:30', end: '5:30', hours: 6.5 },
  3: { start: '10:30', end: '2:30', hours: 4 },
  4: null,
  5: { start: '10:30', end: '5:30', hours: 6.5 },
  6: { start: '10:30', end: '2:30', hours: 4 }
};
const WEEKLY_WORK_HOURS = Object.values(WORK_SCHEDULE).reduce((a, w) => a + (w ? w.hours : 0), 0);
const PROJECT_ORDER = ['BNBS', 'DEV', 'CAREER', 'IREC'];
// Same proportions as the old 15/15/6/4 weekly split (of 40h)
const PROJECT_SHARE = { BNBS: 0.375, DEV: 0.375, CAREER: 0.15, IREC: 0.10 };

function renderProjects() {
  let html = `<h2>Project Work Tracking</h2>
    <div class="grid-4" style="margin-bottom:20px;">`;
  
  ['BNBS', 'DEV', 'CAREER', 'IREC'].forEach(proj => {
    const isActive = state.activeProject === proj;
    const totalSeconds = (state.projectTimers[proj] || 0);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const displayTime = `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
    html += `
      <div style="background:${isActive ? '#e3f2fd' : '#f5f5f5'};border:${isActive ? '2px solid #2196f3' : '1px solid #ddd'};border-radius:8px;padding:15px;">
        <div style="font-size:16px;font-weight:bold;margin-bottom:10px;">${proj}</div>
        <div style="font-size:1.3em;font-weight:bold;margin-bottom:10px;">${displayTime}</div>
        <div style="font-size:1em;margin-bottom:10px;">
          <label>H: <input type="number" value="${hours}" onchange="updateProjectTime('${proj}', parseInt(this.value), parseInt(document.getElementById('${proj}_m').value || 0), parseInt(document.getElementById('${proj}_s').value || 0))" id="${proj}_h" style="width:40px;padding:2px;"/></label>
          <label>M: <input type="number" value="${minutes}" onchange="updateProjectTime('${proj}', parseInt(document.getElementById('${proj}_h').value || 0), parseInt(this.value), parseInt(document.getElementById('${proj}_s').value || 0))" id="${proj}_m" style="width:40px;padding:2px;"/></label>
          <label>S: <input type="number" value="${seconds}" onchange="updateProjectTime('${proj}', parseInt(document.getElementById('${proj}_h').value || 0), parseInt(document.getElementById('${proj}_m').value || 0), parseInt(this.value))" id="${proj}_s" style="width:40px;padding:2px;"/></label>
        </div>
        <button onclick="toggleTimer('${proj}')" style="background:${isActive && state.timerRunning ? '#4caf50' : '#2196f3'};color:#fff;width:100%;padding:8px;margin-bottom:6px;">
          ${isActive && state.timerRunning ? '⏸ Stop' : '▶ Start'}
        </button>
        <button onclick="clearProjectTimer('${proj}')" style="background:#eee;color:#333;width:100%;padding:6px;font-size:0.85em;">
          Clear Today
        </button>
      </div>
    `;
  });
  
  html += `</div>`;
  if (state.timerRunning) {
    html += `<button onclick="stopAllTimers()" style="background:#f44336;color:#fff;width:100%;margin-bottom:20px;">⏹ Stop All</button>`;
  }
  
  const date = document.getElementById('currentDate').value;
  const d = parseDate(date);
  const yearStart = `${d.getFullYear()}-01-01`;
  const monthStart = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  const weekStart = getMondayOfWeek(date);
  
  const targets = {}, monthlyTargets = {}, annualTargets = {};
  PROJECT_ORDER.forEach(p => {
    targets[p] = +(WEEKLY_WORK_HOURS * PROJECT_SHARE[p]).toFixed(1);
    monthlyTargets[p] = +(WEEKLY_WORK_HOURS * PROJECT_SHARE[p] * 4.3).toFixed(1);
    annualTargets[p] = Math.round(WEEKLY_WORK_HOURS * PROJECT_SHARE[p] * 52);
  });

  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const todayIdx = new Date(date + 'T12:00:00').getDay();
  html += `
    <h3>Work Schedule (2:00 lunch taken out on full days only)</h3>
    <div class="card">
      ${dayNames.map((nm, i) => {
        const w = WORK_SCHEDULE[i];
        const hl = i === todayIdx ? 'background:#e3f2fd;' : '';
        if (!w) return `<div style="padding:6px;border-radius:4px;${hl}"><strong>${nm}</strong>: off</div>`;
        const split = PROJECT_ORDER.map(p => `${p} ${(w.hours * PROJECT_SHARE[p]).toFixed(1)}`).join(' · ');
        return `<div style="padding:6px;border-radius:4px;${hl}"><strong>${nm}</strong> ${w.start}–${w.end}: <strong>${w.hours}h</strong><br><span style="font-size:13px;color:#555;">${split}</span></div>`;
      }).join('')}
      <div style="margin-top:8px;font-size:14px;"><strong>Week total: ${WEEKLY_WORK_HOURS}h</strong></div>
    </div>
  `;
  
  html += `
    <h3>Weekly</h3>
    <div class="card">
      ${['BNBS', 'DEV', 'CAREER', 'IREC'].map(proj => {
        const hours = sumProjectHours(proj, weekStart, date).toFixed(1);
        const target = targets[proj];
        const pct = Math.round((hours / target) * 100);
        return `<div style="font-size:16px;margin-bottom:10px;"><strong>${proj}</strong>: ${hours}/${target}h (${pct}%)</div>`;
      }).join('')}
    </div>
    
    <h3>Monthly</h3>
    <div class="card">
      ${['BNBS', 'DEV', 'CAREER', 'IREC'].map(proj => {
        const monthlyAchieved = sumProjectHours(proj, monthStart, date).toFixed(1);
        const monthlyTarget = monthlyTargets[proj];
        const pct = Math.round((monthlyAchieved / monthlyTarget) * 100);
        return `<div style="font-size:16px;margin-bottom:10px;"><strong>${proj}</strong>: ${monthlyAchieved}/${monthlyTarget}h (${pct}%)</div>`;
      }).join('')}
    </div>
    
    <h3>Annual</h3>
    <div class="card">
      ${['BNBS', 'DEV', 'CAREER', 'IREC'].map(proj => {
        const annualAchieved = sumProjectHours(proj, yearStart, date).toFixed(1);
        const annualTarget = annualTargets[proj];
        const pct = Math.round((annualAchieved / annualTarget) * 100);
        return `<div style="font-size:16px;margin-bottom:10px;"><strong>${proj}</strong>: ${annualAchieved}/${annualTarget}h (${pct}%)</div>`;
      }).join('')}
    </div>
  `;
  
  document.getElementById('projectsView').innerHTML = html;
  document.getElementById('routineView').classList.add('hidden');
  document.getElementById('trackingView').classList.add('hidden');
  document.getElementById('workoutsView').classList.add('hidden');
  document.getElementById('projectsView').classList.remove('hidden');
}

function renderWorkouts() {
  let html = `<h2>Workout Components</h2>
    <p style="margin-bottom:20px;font-size:15px;color:#666;">Track each component individually. Target: 6 reps/week per component.</p>`;
  
  html += cashWalkCard();
  html += '<h3>Daily Tracking</h3>';
  ['A', 'B', 'C'].forEach(type => {
    html += `
      <h4 style="font-size:18px;margin:15px 0 8px 0;">Workout ${type}</h4>
      <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:17px;">
        <thead>
          <tr style="background:#333;color:#fff;">
            <th style="text-align:left;padding:10px;border:1px solid #ddd;">Component</th>
            <th style="text-align:center;padding:10px;border:1px solid #ddd;">Count</th>
            <th style="text-align:center;padding:10px;border:1px solid #ddd;">+1</th>
          </tr>
        </thead>
        <tbody>`;
    Object.entries(state.workoutComponents[type]).forEach(([comp, count], i) => {
      const rowBg = i % 2 === 0 ? '#f9f9f9' : '#ffffff';
      html += `
          <tr style="background:${rowBg};">
            <td style="padding:10px;border:1px solid #ddd;">${comp}</td>
            <td style="text-align:center;padding:10px;border:1px solid #ddd;font-weight:bold;font-size:20px;">${count}/6</td>
            <td style="text-align:center;padding:10px;border:1px solid #ddd;">
              <button onclick="toggleWorkoutComponent('${type}', '${comp}')" style="background:#2196f3;color:#fff;padding:8px 16px;font-size:16px;">+1</button>
            </td>
          </tr>`;
    });
    html += `
        </tbody>
      </table>`;
  });
  
  document.getElementById('workoutsView').innerHTML = html;
  document.getElementById('routineView').classList.add('hidden');
  document.getElementById('trackingView').classList.add('hidden');
  document.getElementById('projectsView').classList.add('hidden');
  document.getElementById('workoutsView').classList.remove('hidden');
}

init();

  navigator.serviceWorker.register('/service-worker.js').then(reg => {
    console.log('Service Worker registered', reg);
  }).catch(err => {
    console.log('Service Worker registration failed:', err);
  });
}
