// ---- Live sync ----
// Every localStorage write is noticed here, so the app's own code stays unchanged. Each key
// syncs as a unit, newest timestamp wins. sync* keys belong to this device and never leave it.
const SYNC_URL = 'https://best-life-sync.cadistasio.workers.dev';
const rawGetItem = Storage.prototype.getItem;
const rawSetItem = Storage.prototype.setItem;
const rawRemoveItem = Storage.prototype.removeItem;
const syncGet = k => rawGetItem.call(localStorage, k);
const syncSet = (k, v) => rawSetItem.call(localStorage, k, v);
const syncRemove = k => rawRemoveItem.call(localStorage, k);
const isDeviceOnlyKey = k => /^sync/.test(k);

function syncReadDirty() {
  try { return JSON.parse(syncGet('syncDirty')) || {}; } catch (e) { return {}; }
}

let syncDebounce;
function syncMarkDirty(key, ts = Date.now()) {
  if (!syncGet('syncCode') || isDeviceOnlyKey(key)) return;
  const dirty = syncReadDirty();
  dirty[key] = ts;
  syncSet('syncDirty', JSON.stringify(dirty));
  clearTimeout(syncDebounce);
  syncDebounce = setTimeout(syncNow, 1500);
}

Storage.prototype.setItem = function (key, value) {
  if (this !== localStorage) return rawSetItem.call(this, key, value);
  const before = syncGet(key);
  syncSet(key, value);
  // saveData rewrites many unchanged keys; only real changes may claim a new timestamp.
  if (String(value) !== before) syncMarkDirty(key);
};

Storage.prototype.removeItem = function (key) {
  if (this !== localStorage) return rawRemoveItem.call(this, key);
  const existed = syncGet(key) !== null;
  syncRemove(key);
  if (existed) syncMarkDirty(key);
};

async function syncPost(path, code, body) {
  const res = await fetch(SYNC_URL + path, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${code}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  if (res.status === 401) throw new Error('unauthorized');
  if (!res.ok) throw new Error(`server ${res.status}`);
  return res.json();
}

let syncBusy = false;
let syncAgain = false;
let syncStatus = '';

async function syncNow() {
  const code = syncGet('syncCode');
  if (!code) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true;
  let changed = false;
  try {
    for (let round = 0; round < 1000; round++) {
      const sent = syncReadDirty();
      const keys = Object.keys(sent).slice(0, 200);
      const changes = keys.map(key => {
        const value = syncGet(key);
        return { key, value, ts: sent[key], deleted: value === null };
      });
      const cursor = parseInt(syncGet('syncCursor')) || 0;
      const res = await syncPost('/sync', code, { cursor, changes });

      // Re-read: edits made during the request must stay queued for the next round.
      const dirty = syncReadDirty();
      keys.forEach(k => { if (dirty[k] === sent[k]) delete dirty[k]; });
      res.rows.forEach(row => {
        if (isDeviceOnlyKey(row.key)) return;
        if (dirty[row.key] >= row.ts) return;
        delete dirty[row.key];
        const next = row.deleted ? null : row.value;
        if (syncGet(row.key) === next) return;
        if (next === null) syncRemove(row.key); else syncSet(row.key, next);
        changed = true;
      });
      syncSet('syncDirty', JSON.stringify(dirty));
      syncSet('syncCursor', res.cursor);
      if (!res.more && Object.keys(dirty).length === 0) break;
    }
    syncStatus = `Synced ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  } catch (e) {
    syncStatus = e.message === 'unauthorized'
      ? 'Sync code not accepted. Disconnect and enter it again.'
      : 'Offline. Your changes are saved here and will sync when you reconnect.';
  }
  syncBusy = false;
  if (changed) syncRefreshApp();
  renderSyncBox();
  if (syncAgain) { syncAgain = false; syncNow(); }
}

function syncUserIsTyping() {
  const el = document.activeElement;
  return !!el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
}

let syncRenderPending = false;

// Reload memory from storage, or the next save would write the old values back over the new ones.
function syncRefreshApp() {
  CHECKLIST = loadChecklist();
  cleanChecklist();
  rebuildRoutine();
  const active = state.activeProject;
  const runningTimers = state.timerRunning ? { ...state.projectTimers } : null;
  loadData(document.getElementById('currentDate').value);
  state.activeProject = active;
  if (runningTimers) state.projectTimers = runningTimers;
  state.bedTime = localStorage.getItem('bedTime') || state.bedTime;
  document.getElementById('bedTime').value = state.bedTime;
  document.getElementById('wakeTime').value = localStorage.getItem('wakeTime') || '08:00';
  if (syncUserIsTyping()) syncRenderPending = true;
  else render();
}

document.addEventListener('focusout', () => setTimeout(() => {
  if (syncRenderPending && !syncUserIsTyping()) {
    syncRenderPending = false;
    render();
  }
}, 0));

let syncPendingCode = null;

// Phones capitalize words and turn hyphens into long dashes; only the letters and numbers matter.
function syncCleanCode(raw) {
  const trimmed = (raw || '').trim();
  const bare = trimmed.toLowerCase().replace(/[^a-z0-9]/g, '');
  return bare.length === 25 ? bare.match(/.{5}/g).join('-') : trimmed;
}

async function syncConnect(rawCode) {
  const code = syncCleanCode(rawCode);
  if (!code) return;
  syncStatus = 'Checking code...';
  renderSyncBox();
  try {
    const { total } = await syncPost('/status', code);
    if (total === 0) return syncFinishJoin(code, 'device');
    syncPendingCode = code;
    syncStatus = '';
  } catch (e) {
    const count = code.replace(/[^a-zA-Z0-9]/g, '').length;
    syncStatus = e.message === 'unauthorized'
      ? `That sync code was not accepted. It had ${count} letters and numbers; it should have 25.`
      : `Could not reach the sync service (${e.message}). Check your connection, or turn off any ad blocker or VPN, and try again.`;
  }
  renderSyncBox();
}

function syncAskForCode() {
  const code = prompt('Enter your sync code:');
  if (code) syncConnect(code);
}

// 'device': this device's values are stamped newest, so they replace the online copy.
// 'online': they're stamped oldest, so online values win and only keys it lacks get uploaded.
function syncFinishJoin(code, winner) {
  if (syncPendingCode) exportData(); // Something is about to be replaced, so keep a file first.
  syncPendingCode = null;
  const ts = winner === 'device' ? Date.now() : 1;
  const dirty = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!isDeviceOnlyKey(key)) dirty[key] = ts;
  }
  syncSet('syncDirty', JSON.stringify(dirty));
  syncSet('syncCursor', '0');
  syncSet('syncCode', code);
  syncStatus = 'Syncing...';
  renderSyncBox();
  syncNow();
}

function syncDisconnect() {
  if (!confirm('Turn off sync on this device? Your data stays here, and other devices keep their copies.')) return;
  ['syncCode', 'syncCursor', 'syncDirty'].forEach(syncRemove);
  syncStatus = '';
  renderSyncBox();
}

function renderSyncBox() {
  const box = document.getElementById('syncBox');
  if (!box) return;
  if (syncPendingCode) {
    box.innerHTML = `
      <div class="card card-orange" style="margin:0;">
        <strong>Connect this device: which data is the real one?</strong>
        <p style="font-size:13px;margin:6px 0 10px;">An online copy already exists. A backup file of this device saves first either way.</p>
        <button class="btn-success" style="width:100%;margin-bottom:8px;" onclick="syncFinishJoin(syncPendingCode, 'online')">Use the online copy (for a new device)</button>
        <button class="btn-primary" style="width:100%;margin-bottom:8px;" onclick="syncFinishJoin(syncPendingCode, 'device')">Use this device's data (replaces the online copy)</button>
        <button style="width:100%;background:#f0f0f0;" onclick="syncPendingCode=null;renderSyncBox();">Cancel</button>
      </div>`;
    return;
  }
  if (!syncGet('syncCode')) {
    box.innerHTML = `<button style="width:100%;background:#f0f0f0;" onclick="syncAskForCode()">🔄 Turn on sync</button>${syncStatus ? `<div style="font-size:13px;margin-top:6px;color:#c62828;">${escapeHtml(syncStatus)}</div>` : ''}`;
    return;
  }
  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;">
      <span>🔄 ${escapeHtml(syncStatus || 'Sync on')}</span>
      <span class="mini-row">
        <button class="mini" onclick="syncNow()">Sync now</button>
        <button class="mini" onclick="syncDisconnect()">Disconnect</button>
      </span>
    </div>`;
}

function syncStart() {
  renderSyncBox();
  const fromLink = /^#sync=(.+)$/.exec(location.hash);
  if (fromLink) {
    // Clear the code from the address bar and history straight away.
    history.replaceState(null, '', location.pathname + location.search);
    if (syncGet('syncCode') !== decodeURIComponent(fromLink[1])) syncConnect(decodeURIComponent(fromLink[1]));
  }
  syncNow();
  setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 20000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
  window.addEventListener('focus', syncNow);
  window.addEventListener('online', syncNow);
}

// The checklist is user-editable and saved under 'checklist'. Each item keeps the
// key it was given (slug of the original text for defaults), so completion
// history survives renames and moves. item.date = shown on that date only.
let CHECKLIST = loadChecklist();

function loadChecklist() {
  try {
    const raw = localStorage.getItem('checklist');
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const used = new Set();
  return DEFAULT_CHECKLIST.map(block => ({ ...block, items: block.items.map(it => {
    const item = typeof it === 'string' ? { t: it } : { ...it };
    let key = 'c_' + item.t.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0, 40);
    while (used.has(key)) key += '_';
    used.add(key);
    item.key = key;
    return item;
  }) }));
}

// Cash's daily care, added once to whatever checklist exists. Same-time blocks are
// reused; otherwise a new block goes in time order. The flag stops a deleted task
// from coming back. Item keys are fixed so completion history lines up.
const CASH_DAILY_TASKS = [
  { time: '8:15 AM', tag: 'done by', key: 'c_cash_breakfast', t: 'Cash breakfast: bowl down 15 minutes, then pick it up (save a handful for training)' },
  { time: '9:30 AM', tag: 'start by', key: 'c_cash_exercise', t: 'Dog park with Cash (fixed leash, no toys). Sore-back day: "Find it" in the yard instead' },
  { time: '10:15 AM', tag: 'done by', key: 'c_cash_training_am', t: 'Cash training, 10 min: door "Stay" and "Leave it"' },
  { time: '12:00 PM', tag: 'done by', key: 'c_cash_out_noon', t: 'A few minutes of "Find it" with Cash' },

];

function addCashTasksOnce() {
  if (localStorage.getItem('cashPlanV1')) return;
  const existing = new Set(CHECKLIST.flatMap(b => b.items.map(it => it.key)));
  CASH_DAILY_TASKS.forEach(({ time, tag, key, t }) => {

function hotColdText(t) {
  if (!/heat|hot|cold|🥶/i.test(t)) return t;
  return t
    .replace(/^[\s\/]+/, '')
    .replace(/(?:heat|hot)?\s*\/?\s*(?:🥶)?\s*(?:cold)?\s*\b(?:pad|pack)(s?)\b/gi, (m, pl) => /heat|hot|cold|🥶/i.test(m) ? 'Hot/Cold pack' + pl : m)

    .replace(/\bno heat\b/gi, 'no hot/cold')
    .replace(/\b(\d+ min) heat\b/gi, '$1 hot/cold');
}

function isItemVisible(it, date) { return !it.date || it.date === date; }

function clockToMinutes(s) {
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(s || '');
  if (!m) return 0;
  return (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +m[2];
}

function newItemKey() { return 'c_u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

// New time blocks go in time order; after that they can be moved freely.
function addBlock() {
  const time = document.getElementById('newBlockTime').value;
  if (!time) return alert('Pick a time for the new block');
  const label = formatClock(time);
  const tag = document.getElementById('newBlockTag').value;
  const first = document.getElementById('newBlockTask').value.trim();
  const items = first ? [{ t: first, key: newItemKey() }] : [];
  let at = CHECKLIST.findIndex(b => clockToMinutes(b.time) > clockToMinutes(label));
  if (at === -1) at = CHECKLIST.length;
  CHECKLIST.splice(at, 0, { time: label, tag, items });
  saveChecklist();
}

function moveBlock(bi, dir) {
  const to = bi + dir;
  if (to < 0 || to >= CHECKLIST.length) return;
  [CHECKLIST[bi], CHECKLIST[to]] = [CHECKLIST[to], CHECKLIST[bi]];
  saveChecklist();
}

function editBlock(bi) {

}

}

// Moves past items hidden on this date; at a block's edge it hops into the neighboring block.
function moveItem(bi, ii, dir) {
  const date = document.getElementById('currentDate').value;
  const items = CHECKLIST[bi].items;
  let j = ii + dir;
  while (j >= 0 && j < items.length && !isItemVisible(items[j], date)) j += dir;
  const inBlock = j >= 0 && j < items.length;
  if (!inBlock && !CHECKLIST[bi + dir]) return;
  const [item] = items.splice(ii, 1);
  // Moving down, the removal shifts the neighbor to j-1, so inserting at j lands just after it
  if (inBlock) items.splice(j, 0, item);
  else if (dir < 0) CHECKLIST[bi - 1].items.push(item);
  else CHECKLIST[bi + 1].items.unshift(item);
  saveChecklist();
}

function editItem(bi, ii) {
  const item = CHECKLIST[bi].items[ii];
  const t = prompt('Task:', item.t);
  if (t === null || !t.trim()) return;
  item.t = t.trim();

}

function formatClock(hhmm) {
  if (!hhmm) return '';
  let [h, m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function loadData(date) {
  // Reset to clean defaults first. Without this, switching to a date with
  // no saved data yet would silently keep whatever was in memory from the
  // previously viewed date (e.g. today's timers bleeding into a blank day).
  state.completed = {};
  state.anytimeCompleted = {};
  state.hydration = 0;
  state.projectTimers = { BNBS: 0, DEV: 0, CAREER: 0, IREC: 0 };
  state.activeProject = null;
  state.stepsMinutes = 0;
  state.workoutComponents = {
    A: { 'Hip hinge': 0, 'Squat': 0, 'Side steps': 0, 'Glute bridges': 0, 'Calf raises': 0 },
    B: { 'Overhead press': 0, 'Chest press': 0, 'Row': 0, 'Rear shoulders': 0, 'Bicep curl': 0, 'Tricep ext': 0 },
    C: { 'Suitcase carry': 0, 'Lateral raises': 0, 'Rotation': 0, 'Dead bug/bird dog': 0 }
  };

  const completed = localStorage.getItem(`completed_${date}`);
  const anytime = localStorage.getItem(`anytime_${date}`);
  const hydration = localStorage.getItem(`hydration_${date}`);
  const projects = localStorage.getItem(`projects_${date}`);
  const workouts = localStorage.getItem(`workouts_${date}`);
  const steps = localStorage.getItem(`steps_${date}`);
  const verses = localStorage.getItem('verses');
  const verseIndex = localStorage.getItem('verseIndex');
  
  if (steps) state.stepsMinutes = parseInt(steps) || 0;
  if (completed) state.completed = JSON.parse(completed);
  if (anytime) state.anytimeCompleted = JSON.parse(anytime);
  if (hydration) state.hydration = parseInt(hydration);
  if (projects) state.projectTimers = JSON.parse(projects);
  if (workouts) state.workoutComponents = JSON.parse(workouts);
  if (verses) state.verses = JSON.parse(verses);
  if (verseIndex) state.verseIndex = parseInt(verseIndex);
  
  // Load all sleep data from this week
  const monday = getMondayOfWeek(date);
  const d = parseDate(monday);
  for (let i = 0; i < 7; i++) {
    const dayDate = new Date(d);
    dayDate.setDate(dayDate.getDate() + i);
    const dayStr = toDateStr(dayDate);
    const sleepHours = localStorage.getItem(`sleep_${dayStr}`);
    if (sleepHours) state.sleepData[dayStr] = parseFloat(sleepHours);
    const bed = localStorage.getItem(`sleepBed_${dayStr}`);
    const wake = localStorage.getItem(`sleepWake_${dayStr}`);
    if (bed || wake) state.sleepTimes[dayStr] = { bed: bed || '', wake: wake || '' };
  }
}

function saveData(date) {

  localStorage.setItem(`anytime_${date}`, JSON.stringify(state.anytimeCompleted));
  localStorage.setItem(`hydration_${date}`, state.hydration);
  localStorage.setItem(`projects_${date}`, JSON.stringify(state.projectTimers));
  localStorage.setItem(`workouts_${date}`, JSON.stringify(state.workoutComponents));
  localStorage.setItem(`steps_${date}`, state.stepsMinutes);

}

function submitDashboardSleep() {
  const date = document.getElementById('currentDate').value;
  const bed = document.getElementById('bedTime').value;
  const wake = document.getElementById('wakeTime').value;
  const status = document.getElementById('sleepSubmitStatus');
  if (!date || !bed || !wake) {
    status.style.color = '#f44336';
    status.textContent = 'Please set date, bedtime, and wake time first.';
    return;
  }
  updateSleepTimes(date, bed, wake);
  const hours = computeSleepDuration(bed, wake);
  status.style.color = '#4caf50';
  status.textContent = `Saved: ${hours.toFixed(1)}h sleep for ${date} (bed ${bed} → wake ${wake})`;
}

function updateSleepTimes(dayStr, bed, wake) {
  state.sleepTimes[dayStr] = { bed, wake };
  localStorage.setItem(`sleepBed_${dayStr}`, bed);
  localStorage.setItem(`sleepWake_${dayStr}`, wake);
  if (bed && wake) {
    const hours = computeSleepDuration(bed, wake);
    state.sleepData[dayStr] = hours;
    localStorage.setItem(`sleep_${dayStr}`, hours.toFixed(1));
  }
  render();
}

function computeSleepDuration(bedStr, wakeStr) {
  const [bh, bm] = bedStr.split(':').map(Number);
  const [wh, wm] = wakeStr.split(':').map(Number);
  let bedMinutes = bh * 60 + bm;
  let wakeMinutes = wh * 60 + wm;
  if (wakeMinutes <= bedMinutes) wakeMinutes += 24 * 60;
  return (wakeMinutes - bedMinutes) / 60;
}

function updateSleepHours(dayStr, hours) {
  state.sleepData[dayStr] = hours;
  localStorage.setItem(`sleep_${dayStr}`, hours.toFixed(1));
  render();
}

// ---- Hide / Unhide for every section ----
// Each top-level block in a view gets a Hide link. Hidden ones shrink to a bar with Unhide.
// Keys come from the section's heading with counts removed, so they stay stable.
function hiddenSections() { try { return JSON.parse(localStorage.getItem('hiddenSections')) || {}; } catch (e) { return {}; } }
function toggleSection(key) {
  const h = hiddenSections();
  if (h[key]) delete h[key]; else h[key] = 1;
  localStorage.setItem('hiddenSections', JSON.stringify(h));
  render();
}
function sectionTitle(el) {
  const head = el.querySelector('h2, h3, summary, strong, .verse-ref');
  let t = (head ? head.textContent : el.textContent).replace(/\d+\s*(\/|of)\s*\d+/g, '').replace(/\s+/g, ' ').trim();
  return t.slice(0, 50) || 'Section';
}
function applySectionHiding(viewEl, view) {
  const h = hiddenSections();
  const seen = {};
  [...viewEl.children].forEach(el => {
    if (/^(H2|BUTTON|SCRIPT)$/.test(el.tagName) || !el.textContent.trim()) return;
    const title = sectionTitle(el);
    let key = view + ':' + title;
    seen[key] = (seen[key] || 0) + 1;
    if (seen[key] > 1) key += '#' + seen[key];
    const safe = escapeHtml(key);
    if (h[key]) {
      el.style.display = 'none';
      el.insertAdjacentHTML('beforebegin', `<div class="hidden-bar"><span>${escapeHtml(title)} (hidden)</span><a data-key="${safe}" onclick="toggleSection(this.dataset.key)">Unhide</a></div>`);
      return;
    }
    if (!el.style.position) el.style.position = 'relative';
    const link = `<a class="hide-link" data-key="${safe}" onclick="event.preventDefault();toggleSection(this.dataset.key)">Hide</a>`;
    if (el.tagName === 'DETAILS') { const sum = el.querySelector('summary'); if (sum) sum.insertAdjacentHTML('beforeend', link); }
    else el.insertAdjacentHTML('afterbegin', link);
  });
}

  if (!hhmm) return;
  const date = document.getElementById('currentDate').value;
  state.completed[key] = tsOn(date, hhmm);
  saveData(date);
  render();

function addMovement(mins) {

function toggleAnytime(key, exercise = null) {
  if (!state.anytimeCompleted[key]) state.anytimeCompleted[key] = {};
  if (exercise) {
    state.anytimeCompleted[key][exercise] = !state.anytimeCompleted[key][exercise];
  } else {

  saveData(date);

}

function addHydration(oz) {

function toggleWorkoutComponent(type, component) {

}

let inputIdleTimeout;
let resumeAfterEdit = false;

// Pause while a time is being typed in, then resume 5s later — but only if
// the timer was running before the edit. A stopped timer stays stopped.
function updateProjectTime(proj, h, m, s) {
  state.projectTimers[proj] = (h || 0) * 3600 + (m || 0) * 60 + (s || 0);
  if (state.timerRunning) resumeAfterEdit = true;
  state.timerRunning = false;
  clearTimeout(inputIdleTimeout);
  inputIdleTimeout = setTimeout(() => {
    if (resumeAfterEdit) {
      state.timerRunning = true;
      render();
    }
    resumeAfterEdit = false;
  }, 5000);
  saveState();
  render();
}

// Any explicit start/stop overrides a pending resume from updateProjectTime.
function cancelPendingResume() {
  clearTimeout(inputIdleTimeout);
  resumeAfterEdit = false;
}

function stopAllTimers() {
  cancelPendingResume();
  state.timerRunning = false;
  saveState();
  render();
}

function toggleTimer(project) {
  cancelPendingResume();
  if (state.activeProject === project) {
    state.timerRunning = !state.timerRunning;
  } else {
    state.activeProject = project;
    state.timerRunning = true;
  }
  saveState();
  render();
}

function nextVerse() {
  state.verseIndex = (state.verseIndex + 1) % state.verses.length;
  localStorage.setItem('verseIndex', state.verseIndex);
  render();
}

function prevVerse() {
  state.verseIndex = state.verseIndex === 0 ? state.verses.length - 1 : state.verseIndex - 1;
  localStorage.setItem('verseIndex', state.verseIndex);
  render();
}

function removeVerse() {
  state.verses.splice(state.verseIndex, 1);
  if (state.verses.length === 0) state.verses = [...VERSES];
  state.verseIndex = state.verseIndex >= state.verses.length ? 0 : state.verseIndex;
  localStorage.setItem('verses', JSON.stringify(state.verses));
  localStorage.setItem('verseIndex', state.verseIndex);
  render();
}

function addVerse() {
  const text = document.getElementById('verseText').value;
  const ref = document.getElementById('verseRef').value;
  if (!text || !ref) return alert('Enter verse text and reference');
  state.verses.push({ text, reference: ref, id: Date.now() });
  localStorage.setItem('verses', JSON.stringify(state.verses));
  document.getElementById('verseText').value = '';
  document.getElementById('verseRef').value = '';
  render();
}

function getStepTime(offset) {
  const wake = document.getElementById('wakeTime').value;
  let [h, m] = wake.split(':').map(Number);
  m += offset;
  if (m >= 60) {
    h += Math.floor(m / 60);
    m = m % 60;
  }
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function calculateSleep() {
  const wake = document.getElementById('wakeTime').value;
  const bed = document.getElementById('bedTime').value;
  const bedH = parseInt(bed.split(':')[0]);
  const bedM = parseInt(bed.split(':')[1]);
  const wakeH = parseInt(wake.split(':')[0]);
  const wakeM = parseInt(wake.split(':')[1]);
  
  let bedMin = bedH * 60 + bedM;
  let wakeMin = wakeH * 60 + wakeM;
  if (wakeMin < bedMin) wakeMin += 24 * 60;
  
  return (wakeMin - bedMin) / 60;
}

function calculateBurndownTime(wakeTime, offsetFromEnd) {
  // Work starts at 8:30
  const deadline = 8 * 60 + 30; // 8:30 in minutes
  const [wh, wm] = wakeTime.split(':').map(Number);
  const wakeMin = wh * 60 + wm;
  
  const deadlineMin = deadline - offsetFromEnd;
  const h = Math.floor(deadlineMin / 60);
  const m = deadlineMin % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// Dates are stored as local YYYY-MM-DD. toISOString() is UTC, which rolls over to
// tomorrow in the evening, and new Date("YYYY-MM-DD") parses as UTC midnight,
// which is the previous day locally. Parse at local noon so setDate() and DST stay safe.
function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function parseDate(dateStr) {
  return new Date(dateStr + 'T12:00:00');
}

function getMondayOfWeek(date) {
  const d = parseDate(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  return toDateStr(new Date(d.setDate(diff)));
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function exportData() {
  const backup = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (isDeviceOnlyKey(key)) continue; // The sync code must never end up in a backup file
    backup[key] = localStorage.getItem(key);
  }
  const date = document.getElementById('currentDate').value;
  const file = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = `routine-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const backup = JSON.parse(event.target.result);
      Object.entries(backup).forEach(([key, value]) => {
        if (isDeviceOnlyKey(key)) return;
        localStorage.setItem(key, value);
      });
      if (!('cashPlanV1' in backup)) localStorage.removeItem('cashPlanV1');
      alert('Data restored. Refreshing...');
      location.reload();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function getAnytimeDoneForDate(k, dateStr) {

function getWorkoutCountForDate(type, comp, dateStr) {
  const currentDate = document.getElementById('currentDate').value;
  if (dateStr === currentDate) return state.workoutComponents[type][comp] || 0;
  const raw = localStorage.getItem(`workouts_${dateStr}`);
  if (!raw) return 0;
  try { return JSON.parse(raw)[type]?.[comp] || 0; } catch (e) { return 0; }
}

function sumOverRange(getterFn, startDateStr, endDateStr) {
  let total = 0;
  const d = parseDate(startDateStr);
  const end = parseDate(endDateStr);
  while (d <= end) {
    const dateStr = toDateStr(d);
    total += getterFn(dateStr);
    d.setDate(d.getDate() + 1);
  }
  return total;
}

              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>`;
      }).join('')}
    </div>
  `;

}

function cashRead(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}

function cashDate() { return document.getElementById('currentDate').value; }

function cashStepper(key, delta, max) {
  const now = parseInt(localStorage.getItem(key)) || 0;
  localStorage.setItem(key, Math.min(max, Math.max(0, now + delta)));
  render();
}

function toggleCashWeekly(dateStr, id) {
  const day = cashRead(`cashWeekly_${dateStr}`, {});
  day[id] = !day[id];
  localStorage.setItem(`cashWeekly_${dateStr}`, JSON.stringify(day));
  render();
}

function toggleCashSetup(id) {
  const setup = cashRead('cashSetup', {});
  setup[id] = !setup[id];
  localStorage.setItem('cashSetup', JSON.stringify(setup));
  render();
}

function markCashCare(id) {
  const care = cashRead('cashCare', {});
  care[id] = cashDate();
  localStorage.setItem('cashCare', JSON.stringify(care));
  render();
}

function cashWalkMinutes(dateStr) { return parseInt(localStorage.getItem(`cashWalk_${dateStr}`)) || 0; }

function setCashWalk(value) {
  localStorage.setItem(`cashWalk_${cashDate()}`, Math.max(0, parseInt(value) || 0));
  render();
}

function cashWalkCard() {
  const step = Math.min(parseInt(localStorage.getItem('cashWalkStep')) || 0, CASH_WALK_STEPS.length - 1);
  const date = cashDate();
  const weekTotal = sumOverRange(cashWalkMinutes, getMondayOfWeek(date), date);
  const atTop = step === CASH_WALK_STEPS.length - 1;
  return `
    <div class="card card-orange">
      <h3 style="margin-top:0;">🚶 Your walk with Cash</h3>
      <p style="font-size:15px;margin-bottom:8px;">Today's goal: <strong>${CASH_WALK_STEPS[step]} minutes</strong> (step ${step + 1} of ${CASH_WALK_STEPS.length}), on your 2:00 PM Short Cash walk. Any amount counts.</p>
      <label style="font-weight:normal;font-size:14px;">Minutes today: <input type="number" min="0" value="${cashWalkMinutes(date) || ''}" onchange="setCashWalk(this.value)" style="width:80px;padding:6px;"/></label>
      <p style="font-size:14px;color:#555;margin:8px 0;">This week: ${weekTotal} minutes</p>
      <div class="mini-row" style="flex-wrap:wrap;">
        <button class="mini" onclick="cashStepper('cashWalkStep', -1, ${CASH_WALK_STEPS.length - 1})">← Easier</button>
        <button class="mini" onclick="cashStepper('cashWalkStep', 1, ${CASH_WALK_STEPS.length - 1})">Felt OK, step up →</button>
      </div>
      <p style="font-size:13px;color:#555;margin-top:8px;">Stay on a step as long as you need; six weeks is a target, not a deadline. If walking makes your pain worse, ease back and check with your doctor. ${atTop ? 'You\'re at the top step: try swapping a dog park day for a longer walk when you feel ready.' : 'The dog park stays as his main exercise until you\'re ready for longer walks.'}</p>
    </div>`;
}

function cashCareRow([id, name, how, days]) {
  const last = cashRead('cashCare', {})[id];
  let status = '<span style="color:#666;">Not logged yet</span>';
  if (last) {
    const left = days - Math.round((parseDate(cashDate()) - parseDate(last)) / 86400000);
    status = left <= 0
      ? `<span style="color:#c62828;font-weight:bold;">Due</span> <span style="color:#666;">(last ${last})</span>`
      : `<span style="color:#2e7d32;">Next in ${left} day${left === 1 ? '' : 's'}</span> <span style="color:#666;">(last ${last})</span>`;
  }
  return `<div class="step" style="padding:10px;margin-bottom:6px;">
    <div class="step-header" style="align-items:center;gap:10px;">
      <div style="font-size:14px;"><strong>${name}</strong><br><span style="font-size:12px;color:#555;">${how}</span><br><span style="font-size:12px;">${status}</span></div>
      <button onclick="markCashCare('${id}')" style="flex-shrink:0;background:#f0f0f0;color:#333;">Done</button>
    </div>
  </div>`;
}

// Steps are editable. The saved list lives in schedSteps_<kind> = { regular: [...], bath: [...] };
// until the first edit, the defaults above are used. Bath-block steps carry tub: '<block name>'.
function schedDefault(kind, mode) {
  return SCHEDS[kind].steps[mode].flatMap(s => s.group ? s.items.map(i => ({ ...i, tub: s.group })) : [{ ...s }]);
}
function schedFlat(kind, mode) {
  try { const all = JSON.parse(localStorage.getItem(`schedSteps_${kind}`)); if (all && all[mode]) return all[mode]; } catch (e) {}
  return schedDefault(kind, mode);
}
function schedSaveSteps(kind, mode, list) {
  let all = {};
  try { all = JSON.parse(localStorage.getItem(`schedSteps_${kind}`)) || {}; } catch (e) {}
  SCHEDS[kind].modes.forEach(([m]) => { if (!all[m]) all[m] = schedDefault(kind, m); });
  all[mode] = list;
  localStorage.setItem(`schedSteps_${kind}`, JSON.stringify(all));
  render();
}
function schedEditStep(kind, mode, i) {
  const list = schedFlat(kind, mode);
  const t = prompt('Step:', list[i].t);
  if (t === null || !t.trim()) return;
  list[i].t = t.trim();
  schedSaveSteps(kind, mode, list);
}
function schedSetMinutes(kind, mode, i, value) {
  const list = schedFlat(kind, mode);
  list[i].min = Math.max(0, parseInt(value) || 0);
  schedSaveSteps(kind, mode, list);
}
function schedMoveStep(kind, mode, i, dir) {
  const list = schedFlat(kind, mode);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  schedSaveSteps(kind, mode, list);
}
function schedDeleteStep(kind, mode, i) {
  const list = schedFlat(kind, mode);
  if (!confirm(`Delete "${list[i].t}"? Past check-offs stay recorded.`)) return;
  list.splice(i, 1);
  schedSaveSteps(kind, mode, list);
}
function schedAddStep(kind, mode) {
  const t = document.getElementById(`newStep_${kind}`).value.trim();
  if (!t) return;
  const min = Math.max(0, parseInt(document.getElementById(`newStepMin_${kind}`).value) || 0);
  const list = schedFlat(kind, mode);
  list.push({ id: 's_' + Date.now().toString(36), t, min });
  schedSaveSteps(kind, mode, list);
}

function schedRead(kind, date) {
  try { const v = JSON.parse(localStorage.getItem(`${kind}_${date}`)); if (v && v.done) return v; } catch (e) {}
  return { mode: 'regular', done: {} };
}
function schedWrite(kind, date, v) { localStorage.setItem(`${kind}_${date}`, JSON.stringify(v)); }
function bedClock(mins) { mins = Math.round(mins); return formatClock(`${Math.floor(mins / 60) % 24}:${String(mins % 60).padStart(2, '0')}`); }
function bedMinsOf(ts, date) {
  const d = new Date(ts);
  if (toDateStr(d) !== date) return null;
  return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
}
function hhmmOf(ts) { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function tsOn(date, hhmm) { const [h, m] = hhmm.split(':').map(Number); const d = parseDate(date); d.setHours(h, m, 0, 0); return d.getTime(); }
function nextDateStr(date) { const d = parseDate(date); d.setDate(d.getDate() + 1); return toDateStr(d); }

function setSchedMode(kind, mode) {
  const date = cashDate();
  const v = schedRead(kind, date);
  v.mode = mode;
  schedWrite(kind, date, v);
  render();
}

function schedAfterCheck(kind, step, date, ts) {
  if (step.link) {
    step.link.forEach(k => { if (ROUTINE[k]) state.completed[k] = ts || false; });
    saveData(date);
  }
  if (!ts) return;
  if (step.lights) {
    const night = nextDateStr(date);
    updateSleepTimes(night, hhmmOf(ts), localStorage.getItem(`sleepWake_${night}`) || '');
  }
  if (step.wake) updateSleepTimes(date, localStorage.getItem(`sleepBed_${date}`) || '', hhmmOf(ts));
}

function toggleSchedStep(kind, id) {
  const date = cashDate();
  const v = schedRead(kind, date);
  const step = schedFlat(kind, v.mode).find(s => s.id === id) || { id };
  if (v.done[id]) delete v.done[id]; else v.done[id] = Date.now();
  schedWrite(kind, date, v);
  schedAfterCheck(kind, step, date, v.done[id]);
  render();
}

// Change a recorded time by hand.
function setSchedDoneTime(kind, id, hhmm) {
  if (!hhmm) return;
  const date = cashDate();
  const v = schedRead(kind, date);
  v.done[id] = tsOn(date, hhmm);
  schedWrite(kind, date, v);
  const step = schedFlat(kind, v.mode).find(s => s.id === id) || { id };
  schedAfterCheck(kind, step, date, v.done[id]);
  render();
}

// Start times come from the plan. Only an anchor step (out of bed, Susan asleep) moves the
// rest, by how far its check was from its planned finish. A check made hours off (filled in
// later) moves nothing.
function schedTimes(kind, mode, done, date) {
  const out = {};
  let cursor = SCHEDS[kind].start;
  schedFlat(kind, mode).forEach(s => {
    out[s.id] = cursor;
    cursor += s.min;
    const at = s.anchor && done[s.id] ? bedMinsOf(done[s.id], date) : null;
    if (at !== null && Math.abs(at - cursor) <= 120) cursor = at;
  });
  return out;
}

function packStatus(kind, mode, done) {
  const steps = schedFlat(kind, mode).filter(s => s.pack && done[s.id]).sort((a, b) => done[a.id] - done[b.id]);
  const last = steps[steps.length - 1];
  if (!last) return '';
  const mins = Math.floor((Date.now() - done[last.id]) / 60000);
  if (mins > 180 || mins < 0) return '';
  if (last.pack === 'on') {
    const color = mins >= 20 ? '#c62828' : mins >= 15 ? '#ef6c00' : '#1565c0';
    const msg = mins >= 20 ? 'Take it off now.' : mins >= 15 ? 'Time to take it off soon (15 to 20 min max).' : 'Keep it to 15 to 20 minutes.';
    return `<div class="card" style="border-left:6px solid ${color};background:#fff3e0;"><strong>🔥❄️ Hot/Cold pack on for ${mins} min.</strong> ${msg}</div>`;
  }
  const ready = mins >= 20;
  return `<div class="card" style="border-left:6px solid ${ready ? '#2e7d32' : '#999'};"><strong>⏸️ Hot/Cold pack off for ${mins} min.</strong> ${ready ? 'OK to start the next round.' : `Next round OK in ${20 - mins} min.`}</div>`;
}

// The "Done at" cell, shared with the Daily Checklist: Mark button, or the recorded time
// (editable) with a small ✕ to uncheck.
function doneCell(ts, onMark, onTime) {
  if (!ts) return `<button onclick="${onMark}" style="background:#f0f0f0;color:#333;padding:8px 10px;">Mark</button>`;
  const val = typeof ts === 'number' ? hhmmOf(ts) : '';
  return `<div style="display:flex;gap:4px;align-items:center;justify-content:flex-end;"><input type="time" value="${val}" onchange="${onTime}" style="width:100px;padding:4px;border-color:#4caf50;background:#e8f5e9;" title="Done at (tap to change)"><button class="mini" onclick="${onMark}" title="Uncheck">✕</button></div>`;
}

function renderSched(kind) {
  const cfg = SCHEDS[kind];
  const date = cashDate();
  const v = schedRead(kind, date);
  const flat = schedFlat(kind, v.mode);
  const times = schedTimes(kind, v.mode, v.done, date);
  const doneCount = flat.filter(s => v.done[s.id]).length;
  const btn = ([m, label]) => `<button onclick="setSchedMode('${kind}', '${m}')" style="background:${v.mode === m ? '#333' : '#ddd'};color:${v.mode === m ? '#fff' : '#333'};">${label}</button>`;
  const end = flat.length ? times[flat[flat.length - 1].id] + flat[flat.length - 1].min : cfg.start;

    }
    lastTub = s.tub || null;
    const done = v.done[s.id];
    const icon = s.pack === 'on' ? '🔥❄️ ' : s.pack === 'off' ? '⏸️ ' : s.lights ? '🌙 ' : s.wake ? '☀️ ' : '';
    const bg = done ? '#e8f5e9' : s.pack === 'on' ? '#fff3e0' : s.tub ? '#f5fbff' : '#fff';
    rows += `<tr style="background:${bg};">
      <td style="padding:6px;border:1px solid #ddd;white-space:nowrap;font-weight:bold;font-size:13px;vertical-align:top;">${bedClock(times[s.id])}</td>
      <td style="padding:6px;border:1px solid #ddd;font-size:14px;">${s.anchor ? '⚓ ' : ''}${icon}${escapeHtml(s.t)}
        <div class="mini-row" style="margin-top:4px;">
          <button class="mini" onclick="schedMoveStep('${kind}', '${v.mode}', ${i}, -1)" title="Move up">↑</button>
          <button class="mini" onclick="schedMoveStep('${kind}', '${v.mode}', ${i}, 1)" title="Move down">↓</button>
          <button class="mini" onclick="schedEditStep('${kind}', '${v.mode}', ${i})" title="Edit">✎</button>

        </div></td>
      <td style="padding:6px;border:1px solid #ddd;text-align:center;vertical-align:top;"><input type="number" min="0" value="${s.min}" onchange="schedSetMinutes('${kind}', '${v.mode}', ${i}, this.value)" style="width:48px;padding:4px;" title="Minutes"></td>
      <td style="padding:6px;border:1px solid #ddd;text-align:right;vertical-align:top;">${doneCell(done, `toggleSchedStep('${kind}', '${s.id}')`, `setSchedDoneTime('${kind}', '${s.id}', this.value)`)}</td>
    </tr>`;
  });
  const th = 'padding:6px;border:1px solid #ddd;text-align:left;font-size:13px;';
  let html = (kind === 'am' ? verseOfDayCard() : '') + `
    <h2>${cfg.title}</h2>
    <div class="grid-2" style="margin-bottom:10px;">${cfg.modes.map(btn).join('')}</div>
    <div class="card card-blue" style="position:sticky;top:0;z-index:5;">
      <strong>${doneCount} of ${flat.length} done</strong> <span style="font-size:13px;color:#555;">· planned ${bedClock(cfg.start)} to ${bedClock(end)}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${flat.length ? (doneCount / flat.length) * 100 : 0}%"></div></div>
    </div>
    <div id="packStatus_${kind}">${packStatus(kind, v.mode, v.done)}</div>

function schedTrackingCard(kind, date, weekStart, monthStart, yearStart, daysInMonth, daysInYear) {
  const cfg = SCHEDS[kind];
  const label = kind === 'am' ? 'morning' : 'night';
  const v = schedRead(kind, date);
  const flat = schedFlat(kind, v.mode);
  const finishId = flat.length ? flat[flat.length - 1].id : cfg.finish;
  const count = f => [sumOverRange(f, weekStart, date) + '/7', sumOverRange(f, monthStart, date) + '/' + daysInMonth, sumOverRange(f, yearStart, date) + '/' + daysInYear];
  const marks = [];
  sumOverRange(dt => { const ts = schedRead(kind, dt).done[cfg.anchor]; const m = ts ? bedMinsOf(ts, dt) : null; if (m !== null) marks.push(m); return 0; }, weekStart, date);
  const avg = marks.length ? bedClock(marks.reduce((a, b) => a + b, 0) / marks.length) : 'none yet';
  const rows = [
    [`<b>${label[0].toUpperCase() + label.slice(1)}s finished</b>`, v.done[finishId] ? '✓' : '', ...count(dt => schedRead(kind, dt).done[finishId] ? 1 : 0)],
    [`<b>Bath ${label}s</b>`, v.mode === 'bath' ? '✓' : '', ...count(dt => schedRead(kind, dt).mode === 'bath' ? 1 : 0)],
    ...flat.map(s => [escapeHtml(s.t.length > 60 ? s.t.slice(0, 57) + '...' : s.t),
      doneCell(v.done[s.id], `toggleSchedStep('${kind}', '${s.id}')`, `setSchedDoneTime('${kind}', '${s.id}', this.value)`),
      ...count(dt => schedRead(kind, dt).done[s.id] ? 1 : 0)])
  ];
  return totalsTable(cfg.title, rows, `Average ${cfg.anchorLabel} this week: ${avg}. Today's column shows the time each step was checked, and you can change it.`);
}

// Each verse appears weight times per cycle, evenly spaced, starting at its own fixed offset
// (from a hash of its reference) so testaments and topics mix instead of bunching.
const VOTD_ORDER = (() => {
  const events = [];
  VOTD.forEach((v, i) => {
    const w = v[3] * (v[4] ? 2 : 1);
    let h = 0;
    for (const ch of v[0]) h = (h * 31 + ch.charCodeAt(0)) % 100003;
    const phase = (h % 1000) / 1000;
    for (let j = 0; j < w; j++) events.push([(j + phase) / w, i]);
  });
  events.sort((x, y) => x[0] - y[0]);
  return events.map(e => e[1]);
})();

function verseForDate(date) {
  const day = Math.round((parseDate(date) - new Date(2026, 0, 1)) / 86400000);
  const n = VOTD_ORDER.length;
  return VOTD[VOTD_ORDER[((day % n) + n) % n]];
}

function getProjectHoursForDate(proj, dateStr) {
  const currentDate = document.getElementById('currentDate').value;
  if (dateStr === currentDate) {
    return (state.projectTimers[proj] || 0) / 3600;
  }
  const raw = localStorage.getItem(`projects_${dateStr}`);
  if (!raw) return 0;
  try {
    const data = JSON.parse(raw);
    return (data[proj] || 0) / 3600;
  } catch (e) {
    return 0;
  }
}

function sumProjectHours(proj, startDateStr, endDateStr) {
  let total = 0;
  const d = parseDate(startDateStr);
  const end = parseDate(endDateStr);
  while (d <= end) {
    const dateStr = toDateStr(d);
    total += getProjectHoursForDate(proj, dateStr);
    d.setDate(d.getDate() + 1);
  }
  return total;
}

function clearProjectTimer(proj) {
  if (!confirm(`Clear today's ${proj} timer back to 0? This won't affect past days already recorded.`)) return;
  state.projectTimers[proj] = 0;
  cancelPendingResume();
  if (state.activeProject === proj) state.timerRunning = false;
  saveState();
  render();
}

    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const displayTime = `${hours}h ${String(minutes).padStart(2, '0')}m ${String(seconds).padStart(2, '0')}s`;
    html += `
      <div style="background:${isActive ? '#e3f2fd' : '#f5f5f5'};border:${isActive ? '2px solid #2196f3' : '1px solid #ddd'};border-radius:8px;padding:15px;">
        <div style="font-size:16px;font-weight:bold;margin-bottom:10px;">${proj}</div>
        <div style="font-size:1.3em;font-weight:bold;margin-bottom:10px;">${displayTime}</div>
        <div style="font-size:1em;margin-bottom:10px;">
          <label>H: <input type="number" value="${hours}" onchange="updateProjectTime('${proj}', parseInt(this.value), parseInt(document.getElementById('${proj}_m').value || 0), parseInt(document.getElementById('${proj}_s').value || 0))" id="${proj}_h" style="width:40px;padding:2px;"/></label>
          <label>M: <input type="number" value="${minutes}" onchange="updateProjectTime('${proj}', parseInt(document.getElementById('${proj}_h').value || 0), parseInt(this.value), parseInt(document.getElementById('${proj}_s').value || 0))" id="${proj}_m" style="width:40px;padding:2px;"/></label>
          <label>S: <input type="number" value="${seconds}" onchange="updateProjectTime('${proj}', parseInt(document.getElementById('${proj}_h').value || 0), parseInt(document.getElementById('${proj}_m').value || 0), parseInt(this.value))" id="${proj}_s" style="width:40px;padding:2px;"/></label>
        </div>
        <button onclick="toggleTimer('${proj}')" style="background:${isActive && state.timerRunning ? '#4caf50' : '#2196f3'};color:#fff;width:100%;padding:8px;margin-bottom:6px;">
          ${isActive && state.timerRunning ? '⏸ Stop' : '▶ Start'}
        </button>
        <button onclick="clearProjectTimer('${proj}')" style="background:#eee;color:#333;width:100%;padding:6px;font-size:0.85em;">
          Clear Today
        </button>
      </div>
    `;
  });
  
  html += `</div>`;
  if (state.timerRunning) {
    html += `<button onclick="stopAllTimers()" style="background:#f44336;color:#fff;width:100%;margin-bottom:20px;">⏹ Stop All</button>`;
  }
  
  const date = document.getElementById('currentDate').value;
  const d = parseDate(date);
  const yearStart = `${d.getFullYear()}-01-01`;
  const monthStart = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
  const weekStart = getMondayOfWeek(date);
  
  const targets = {}, monthlyTargets = {}, annualTargets = {};
  PROJECT_ORDER.forEach(p => {
    targets[p] = +(WEEKLY_WORK_HOURS * PROJECT_SHARE[p]).toFixed(1);
    monthlyTargets[p] = +(WEEKLY_WORK_HOURS * PROJECT_SHARE[p] * 4.3).toFixed(1);
    annualTargets[p] = Math.round(WEEKLY_WORK_HOURS * PROJECT_SHARE[p] * 52);
  });

  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const todayIdx = new Date(date + 'T12:00:00').getDay();
  html += `
    <h3>Work Schedule (2:00 lunch taken out on full days only)</h3>
    <div class="card">
      ${dayNames.map((nm, i) => {
        const w = WORK_SCHEDULE[i];
        const hl = i === todayIdx ? 'background:#e3f2fd;' : '';
        if (!w) return `<div style="padding:6px;border-radius:4px;${hl}"><strong>${nm}</strong>: off</div>`;
        const split = PROJECT_ORDER.map(p => `${p} ${(w.hours * PROJECT_SHARE[p]).toFixed(1)}`).join(' · ');
        return `<div style="padding:6px;border-radius:4px;${hl}"><strong>${nm}</strong> ${w.start}–${w.end}: <strong>${w.hours}h</strong><br><span style="font-size:13px;color:#555;">${split}</span></div>`;
      }).join('')}
      <div style="margin-top:8px;font-size:14px;"><strong>Week total: ${WEEKLY_WORK_HOURS}h</strong></div>
    </div>
  `;
  
  html += `
    <h3>Weekly</h3>
    <div class="card">
      ${['BNBS', 'DEV', 'CAREER', 'IREC'].map(proj => {
        const hours = sumProjectHours(proj, weekStart, date).toFixed(1);
        const target = targets[proj];
        const pct = Math.round((hours / target) * 100);
        return `<div style="font-size:16px;margin-bottom:10px;"><strong>${proj}</strong>: ${hours}/${target}h (${pct}%)</div>`;
      }).join('')}
    </div>
    
    <h3>Monthly</h3>
    <div class="card">
      ${['BNBS', 'DEV', 'CAREER', 'IREC'].map(proj => {
        const monthlyAchieved = sumProjectHours(proj, monthStart, date).toFixed(1);
        const monthlyTarget = monthlyTargets[proj];
        const pct = Math.round((monthlyAchieved / monthlyTarget) * 100);
        return `<div style="font-size:16px;margin-bottom:10px;"><strong>${proj}</strong>: ${monthlyAchieved}/${monthlyTarget}h (${pct}%)</div>`;
      }).join('')}
    </div>
    
    <h3>Annual</h3>
    <div class="card">
      ${['BNBS', 'DEV', 'CAREER', 'IREC'].map(proj => {
        const annualAchieved = sumProjectHours(proj, yearStart, date).toFixed(1);
        const annualTarget = annualTargets[proj];
        const pct = Math.round((annualAchieved / annualTarget) * 100);
        return `<div style="font-size:16px;margin-bottom:10px;"><strong>${proj}</strong>: ${annualAchieved}/${annualTarget}h (${pct}%)</div>`;
      }).join('')}
    </div>
  `;
  
  document.getElementById('projectsView').innerHTML = html;
  document.getElementById('routineView').classList.add('hidden');
  document.getElementById('trackingView').classList.add('hidden');
  document.getElementById('workoutsView').classList.add('hidden');
  document.getElementById('projectsView').classList.remove('hidden');
}

function renderWorkouts() {
  let html = `<h2>Workout Components</h2>
    <p style="margin-bottom:20px;font-size:15px;color:#666;">Track each component individually. Target: 6 reps/week per component.</p>`;
  
  html += cashWalkCard();
  html += '<h3>Daily Tracking</h3>';
  ['A', 'B', 'C'].forEach(type => {
    html += `
      <h4 style="font-size:18px;margin:15px 0 8px 0;">Workout ${type}</h4>
      <table style="width:100%;border-collapse:collapse;margin-bottom:20px;font-size:17px;">
        <thead>
          <tr style="background:#333;color:#fff;">
            <th style="text-align:left;padding:10px;border:1px solid #ddd;">Component</th>
            <th style="text-align:center;padding:10px;border:1px solid #ddd;">Count</th>
            <th style="text-align:center;padding:10px;border:1px solid #ddd;">+1</th>
          </tr>
        </thead>
        <tbody>`;
    Object.entries(state.workoutComponents[type]).forEach(([comp, count], i) => {
      const rowBg = i % 2 === 0 ? '#f9f9f9' : '#ffffff';
      html += `
          <tr style="background:${rowBg};">
            <td style="padding:10px;border:1px solid #ddd;">${comp}</td>
            <td style="text-align:center;padding:10px;border:1px solid #ddd;font-weight:bold;font-size:20px;">${count}/6</td>
            <td style="text-align:center;padding:10px;border:1px solid #ddd;">
              <button onclick="toggleWorkoutComponent('${type}', '${comp}')" style="background:#2196f3;color:#fff;padding:8px 16px;font-size:16px;">+1</button>
            </td>
          </tr>`;
    });
    html += `
        </tbody>
      </table>`;
  });
  
  document.getElementById('workoutsView').innerHTML = html;
  document.getElementById('routineView').classList.add('hidden');
  document.getElementById('trackingView').classList.add('hidden');
  document.getElementById('projectsView').classList.add('hidden');
  document.getElementById('workoutsView').classList.remove('hidden');
}

init();
syncStart();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').then(reg => {
    console.log('Service Worker registered', reg);
  }).catch(err => {
    console.log('Service Worker registration failed:', err);
  });
}
  </script>
